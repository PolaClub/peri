version: '3.8'

services:
  peri-dev:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_STORAGE_MODE=${VITE_STORAGE_MODE:-local}
      - VITE_API_BASE_URL=http://localhost:3001/api
    depends_on:
      - backend
    container_name: peri-dev
    profiles:
      - development

  peri-prod:
    build:
      context: .
      target: production
      args:
        - VITE_STORAGE_MODE=${VITE_STORAGE_MODE:-local}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3001/api}
        - VITE_APP_VERSION=${VITE_APP_VERSION:-v2.6.6}
        - VITE_FEATURE_USE_CUSTOM_VERSION_UPDATE=${VITE_FEATURE_USE_CUSTOM_VERSION_UPDATE:-true}
        - VITE_FEATURE_DEMO_MODE=${VITE_FEATURE_DEMO_MODE:-false}
        - VITE_FEATURE_BETA_LANGUAGES=${VITE_FEATURE_BETA_LANGUAGES:-true}
        - VITE_FEATURE_NOTIFICATIONS=${VITE_FEATURE_NOTIFICATIONS:-true}
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend-prod
    container_name: peri-prod
    profiles:
      - production
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://peri_user:peri_password@db:5432/peri_db
      - PORT=3001
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev
    container_name: peri-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - development

  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://peri_user:peri_password@db:5432/peri_db
      - PORT=3001
      - FRONTEND_URL=http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    container_name: peri-backend-prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - production

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=peri_user
      - POSTGRES_PASSWORD=peri_password
      - POSTGRES_DB=peri_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peri_user -d peri_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: peri-db

volumes:
  postgres_data:
